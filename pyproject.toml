[project]
name = "delegation-bot"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "python-telegram-bot==21.6",
  "openai>=1.50",
  "google-api-python-client>=2.140",
  "google-auth-oauthlib>=1.2",
  "apscheduler==3.10.4",
  "sqlalchemy>=2.0",
  "pydantic>=2.8",
  "aiohttp>=3.10",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "freezegun>=1.5"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
